# Nginx 片段：将 e2etrans（豆包端到端语音 Demo）挂载到 obbot.tpcnailab.com/v2
# 追加到 /etc/nginx/sites-enabled/voice-bot 的 HTTPS server 块内（/health 块之后），
# 然后执行：nginx -t && systemctl reload nginx
#
# tp-azure 统一认证回调地址：/v2/auth/verify（对应 APP_NAME=e2etrans 在
# cluster.tpcnailab.com 上注册的回调）

    # ==================== e2etrans v2（豆包端到端语音 Demo） ====================
    location = /v2 {
        return 301 /v2/;
    }

    location /v2/ {
        # 结尾带斜杠：剥离 /v2 前缀后转发（应用内部路由仍在根路径）
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（/v2/ws/*）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        # WebSocket 长连接（工作台/实时语音）
        proxy_read_timeout    86400s;

        proxy_buffering off;
        client_max_body_size 20M;
    }
