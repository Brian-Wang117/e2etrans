<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>端到端语音 Demo - 登录</title>
    <link rel="icon" href="data:," />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 60px 50px;
        text-align: center;
        max-width: 450px;
        width: 90%;
      }
      h1 { color: #333; font-size: 22px; margin-bottom: 10px; }
      .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
      .login-button {
        display: inline-block;
        width: 100%;
        padding: 14px 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 10px;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .login-button:hover { opacity: 0.92; transform: translateY(-1px); }
      .error { color: #dc3545; font-size: 14px; margin-bottom: 20px; }
      .footer { color: #aaa; font-size: 12px; margin-top: 28px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>豆包端到端语音 Demo</h1>
      <p class="subtitle">请使用企业账号登录</p>
      {{error_html}}
      <a class="login-button" href="{{login_url}}">企业账号登录</a>
      <p class="footer">登录即表示同意通过企业统一认证（Azure AD）验证身份</p>
    </div>
  </body>
</html>
